<template>
    <div class="st-wrapper">
        <div class="st-header">
            <div class="st-header-left">
                <div class="st-header-icon">
                    <lightning-icon icon-name="utility:setup" size="small"></lightning-icon>
                </div>
                <div>
                    <h2 class="st-title">Submission Template</h2>
                    <p class="st-subtitle">Configure required documents and stages for this job</p>
                </div>
            </div>
            <div class="st-header-right">
                <template if:true={isDirty}>
                    <span class="st-unsaved-badge">Unsaved changes</span>
                </template>
                <lightning-button-icon 
                    icon-name="utility:settings" 
                    variant="border-filled" 
                    alternative-text="Manage Requirements"
                    title="Manage Requirements"
                    onclick={openSettingsModal}
                    disabled={isSaving}>
                </lightning-button-icon>
                <lightning-button label="Reset" onclick={handleReset} disabled={isSaving}></lightning-button>
                <lightning-button label="Save Template" variant="brand" onclick={handleSave} disabled={isSaving}></lightning-button>
            </div>
        </div>

        <template if:true={isSaving}>
            <div class="st-saving-bar">
                <lightning-spinner size="x-small" alternative-text="Saving..."></lightning-spinner>
                <span>Saving template...</span>
            </div>
        </template>

        <template if:true={isLoading}>
            <div class="st-loading">
                <lightning-spinner size="medium" alternative-text="Loading..."></lightning-spinner>
                <p>Loading template...</p>
            </div>
        </template>

        <template if:false={isLoading}>
            
            <template if:true={isCanvasEmpty}>
                <div class="st-empty-state">
                    <lightning-icon icon-name="utility:slider" size="large" class="st-empty-icon"></lightning-icon>
                    <h3>No Requirements Configured</h3>
                    <p>Start building this job's template by selecting documents from the master list.</p>
                    <lightning-button label="Add Requirements" variant="brand" icon-name="utility:add" onclick={openSettingsModal}></lightning-button>
                </div>
            </template>

            <template if:false={isCanvasEmpty}>
                <div class="st-grid-header">
                    <div class="st-col-drag"></div> 
                    <div class="st-col-stage">Requirement Stage</div>
                    <div class="st-col-index">Order</div>
                    <div class="st-col-required">Mandatory</div>
                    <div class="st-col-actions">Actions</div>
                </div>

                <div class="st-grid-body" ondragover={handleDragOverContainer}>
                    <template for:each={canvasStages} for:item="stage">
                        <div key={stage.key} 
                             class={stage.rowClass} 
                             draggable="true"
                             ondragstart={handleDragStart}
                             ondragover={handleDragOver}
                             ondragleave={handleDragLeave}
                             ondrop={handleDrop}
                             data-key={stage.key}>

                            <div class="st-col-drag" title="Drag to reorder">
                                <lightning-icon icon-name="utility:rows" size="x-small" class="st-drag-icon"></lightning-icon>
                            </div>

                            <div class="st-col-stage">
                                <div class="st-stage-name-wrap">
                                    <lightning-icon icon-name={stage.iconName} size="x-small" class="st-stage-icon"></lightning-icon>
                                    <div class="st-stage-info">
                                        <span class="st-stage-label">{stage.label}</span>
                                        <span class="st-stage-key">{stage.key}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="st-col-index">
                                <span class="st-index-value">{stage.index}</span>
                            </div>

                            <div class="st-col-required">
                                <template if:false={stage.isLocked}>
                                    <div class={stage.requiredToggleClass} data-key={stage.key} onclick={handleToggleRequired} role="switch" aria-checked={stage.isRequiredStr} tabindex="0">
                                        <div class="st-toggle-knob"></div>
                                    </div>
                                </template>
                                <template if:true={stage.isLocked}>
                                    <div class="st-toggle st-toggle--on st-toggle--disabled" title="Required by default">
                                        <div class="st-toggle-knob"></div>
                                    </div>
                                </template>
                                <span class="st-toggle-label">{stage.requiredLabel}</span>
                            </div>

                            <div class="st-col-actions">
                                <template if:false={stage.isLocked}>
                                    <lightning-button-icon icon-name="utility:delete" variant="bare" class="st-delete-btn" alternative-text="Remove from template" title="Remove" data-key={stage.key} onclick={handleRemoveFromCanvas}></lightning-button-icon>
                                </template>
                                <template if:true={stage.isLocked}>
                                    <lightning-icon icon-name="utility:lock" size="x-small" class="st-locked-icon" title="Mandatory Stage (Cannot be removed)"></lightning-icon>
                                </template>
                            </div>

                        </div>
                    </template>
                </div>

                <div class="st-footer">
                    <div class="st-footer-stat">
                        <span class="st-footer-num">{totalCount}</span>
                        <span class="st-footer-label">Selected Stages</span>
                    </div>
                    <div class="st-footer-divider"></div>
                    <div class="st-footer-stat">
                        <span class="st-footer-num">{requiredCount}</span>
                        <span class="st-footer-label">Mandatory Stages</span>
                    </div>
                </div>
            </template>
        </template>

        <template if:true={isModalOpen}>
            <div class="st-modal-backdrop">
                <div class="st-modal">
                    <div class="st-modal-header">
                        <h2 class="st-modal-title">Manage Requirements</h2>
                        <button class="st-modal-close" onclick={closeSettingsModal}>
                            <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                        </button>
                    </div>
                    <div class="st-modal-body">
                        <p class="st-modal-desc">Select the documents and stages required for this specific job. You can reorder them and set them as mandatory later.</p>
                        <div class="st-palette-list">
                            <template for:each={paletteStages} for:item="item">
                                <label key={item.key} class={item.itemClass}>
                                    <div class="st-palette-checkbox">
                                        <lightning-input type="checkbox" checked={item.isSelected} disabled={item.isLocked} data-key={item.key} onchange={handlePaletteSelection}></lightning-input>
                                    </div>
                                    <div class="st-palette-details">
                                        <lightning-icon icon-name={item.iconName} size="x-small" class="st-palette-icon"></lightning-icon>
                                        <div class="st-palette-text">
                                            <span class="st-palette-label">
                                                {item.label}
                                                <template if:true={item.isLocked}>
                                                    <span class="st-locked-badge">(Required)</span>
                                                </template>
                                            </span>
                                            <span class="st-palette-key">{item.key}</span>
                                        </div>
                                    </div>
                                </label>
                            </template>
                        </div>
                    </div>
                    <div class="st-modal-footer">
                        <button class="st-modal-cancel" onclick={closeSettingsModal}>Cancel</button>
                        <button class="st-modal-proceed" onclick={applySettings}>Apply Selection</button>
                    </div>
                </div>
            </div>
        </template>
    </div>
</template>
