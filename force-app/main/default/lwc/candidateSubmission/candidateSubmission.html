<template>
    <div class="cs-wrapper slds-is-relative">

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>

        <div class="cs-card">

            <!-- ── Header ── -->
<template if:false={hideHeader}>
    <div class="cs-card-header">
        <h1 class="cs-title">Candidate Submission</h1>
    </div>
</template>

            <div class={tabsStickyClass}>
                <div class="cs-tabs" role="tablist">
                    <template for:each={stagesWithMeta} for:item="tab">
                        <button key={tab.value} role="tab" class={tab.tabClass}
                                aria-selected={tab.isActive} data-value={tab.value}
                                onclick={handleStageSelect}>
                            <span class={tab.iconClass}>
                                <template if:true={tab.isDone}>
                                    <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                </template>
                                <template if:false={tab.isDone}>
                                    <lightning-icon icon-name={tab.iconName} size="xx-small" class="cs-tab-stage-icon"></lightning-icon>
                                </template>
                            </span>
                            {tab.label}
                        </button>
                    </template>
                </div>
            </div>

            <!-- ── Body ── -->
            <div class="cs-card-body">

                <template if:true={isResumeStage}>
                    <c-candidate-submission-stage-resume
                        candidate-id={submissionData.candidateId}
                        job-applicant-id={submissionData.jobApplicantId}
                        submission-record-id={submissionRecordId}
                        selected-resume-id={submissionData.documents.Resume}
                        onresumeselectionchange={handleResumeSelectionChange}
                        ondocumentsrefresh={handleStageDocumentsRefresh}>
                    </c-candidate-submission-stage-resume>
                </template>

                <template if:true={isReferencesStage}>
                    <c-candidate-submission-stage-references
                        candidate-id={submissionData.candidateId}
                        job-applicant-id={submissionData.jobApplicantId}
                        submission-record-id={submissionRecordId}
                        selected-document-id={submissionData.documents.References}
                        ondocumentsrefresh={handleStageDocumentsRefresh}
                        onselectionchange={handleFileStageSelectionChange}>
                    </c-candidate-submission-stage-references>
                </template>

                <template if:true={isBlsStage}>
                    <c-candidate-submission-stage-bls-card
                        candidate-id={submissionData.candidateId}
                        job-applicant-id={submissionData.jobApplicantId}
                        submission-record-id={submissionRecordId}
                        selected-document-id={submissionData.documents.BLS_Card}
                        excluded-document-ids={blsExcludedDocIds}
                        onselectionchange={handleFileStageSelectionChange}
                        ondocumentsrefresh={handleStageDocumentsRefresh}>
                    </c-candidate-submission-stage-bls-card>
                </template>

                <template if:true={isAclsStage}>
                    <c-candidate-submission-stage-acls-card
                        candidate-id={submissionData.candidateId}
                        job-applicant-id={submissionData.jobApplicantId}
                        submission-record-id={submissionRecordId}
                        selected-document-id={submissionData.documents.ACLS_Card}
                        excluded-document-ids={aclsExcludedDocIds}
                        onselectionchange={handleFileStageSelectionChange}
                        ondocumentsrefresh={handleStageDocumentsRefresh}>
                    </c-candidate-submission-stage-acls-card>
                </template>

                <!-- <template if:true={isSkillsChecklistStage}>
                    <c-candidate-submission-stage-skills-checklist
                        candidate-id={submissionData.candidateId}
                        job-applicant-id={submissionData.jobApplicantId}
                        selected-document-id={submissionData.documents.Skills_Checklist}
                        excluded-document-ids={skillsChecklistExcludedDocIds}
                        onselectionchange={handleFileStageSelectionChange}
                        ondocumentsrefresh={handleStageDocumentsRefresh}>
                    </c-candidate-submission-stage-skills-checklist>
                </template> -->

                <template if:true={isCredentialsStage}>
                    <c-candidate-submission-stage-credentials
                        candidate-id={submissionData.candidateId}
                        job-applicant-id={submissionData.jobApplicantId}
                        submission-record-id={submissionRecordId}
                        selected-document-id={submissionData.documents.Credentials}
                        excluded-document-ids={credentialsExcludedDocIds}
                        onselectionchange={handleFileStageSelectionChange}
                        ondocumentsrefresh={handleStageDocumentsRefresh}>
                    </c-candidate-submission-stage-credentials>
                </template>

                <template if:true={isReviewStage}>
                    <c-candidate-submission-stage-review
                        candidate-id={submissionData.candidateId}
                        job-applicant-id={submissionData.jobApplicantId}
                        submission-record-id={submissionRecordId}
                        documents={submissionData.documents}
                        pre-selected-resume-id={preSelectedResumeId}
                        pre-selected-resume-name={preSelectedResumeName}
                        onmergedchange={handleReviewMergedChange}
                        ondocumentsrefresh={handleStageDocumentsRefresh}>
                    </c-candidate-submission-stage-review>
                </template>

            </div><!-- /cs-card-body -->

            <!-- ── Footer ── -->
            <div class="cs-footer">
                <div class="cs-footer-left">
                    <template if:false={isResumeStage}>
                        <lightning-button label="Back" icon-name="utility:back"
                                          variant="neutral" onclick={handlePrevious}>
                        </lightning-button>
                    </template>
                </div>
                <div class="cs-footer-right">
                    <template if:false={isReviewStage}>
                        <lightning-button label="Save &amp; Next Stage" variant="brand"
                                          icon-name="utility:forward" icon-position="right"
                                          onclick={handleNext}>
                        </lightning-button>
                    </template>
                    <template if:true={isReviewStage}>
                        <lightning-button label="Submit Application" variant="success"
                                          icon-name="utility:send" onclick={handlePreSubmitCheck}>
                        </lightning-button>
                    </template>
                </div>
            </div>

        </div><!-- /cs-card -->

        <!-- ── Validation Modal ── -->
        <template if:true={showValidationModal}>
            <div class="cs-modal-backdrop">
                <div class="cs-modal">
                    <div class="cs-modal-header">
                        <h2 class="cs-modal-title">Incomplete Submission</h2>
                        <button class="cs-modal-close" onclick={closeValidationModal}>
                            <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                        </button>
                    </div>
                    <div class="cs-modal-body">
                        <p class="cs-modal-desc">You are missing the following items. Do you wish to still submit internally?</p>
                        <ul class="cs-missing-list">
                            <template for:each={missingItems} for:item="item">
                                <li key={item}>{item}</li>
                            </template>
                        </ul>
                    </div>
                    <div class="cs-modal-footer">
                        <button class="cs-modal-cancel" onclick={closeValidationModal}>Cancel</button>
                        <button class="cs-modal-proceed" onclick={handleProceedSubmit}>Proceed to Internal Submission</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- ── Account Manager Modal ── -->
        <template if:true={showAccountManagerModal}>
            <div class="cs-modal-backdrop">
                <div class="cs-modal">
                    <div class="cs-modal-header">
                        <h2 class="cs-modal-title">Select Account Manager</h2>
                        <button class="cs-modal-close" onclick={closeAccountManagerModal}>
                            <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                        </button>
                    </div>
                    <div class="cs-modal-body" style="min-height: 120px;">
                        <p class="cs-modal-desc slds-m-bottom_medium">Please select the Account Manager for this submission:</p>
                        <lightning-record-picker
                            label="Account Manager"
                            placeholder="Search Contacts..."
                            object-api-name="Contact"
                            onchange={handleAccountManagerChange}
                            class="cs-am-picker">
                        </lightning-record-picker>
                        <template if:true={amPickerError}>
                            <p class="slds-text-color_error slds-m-top_x-small">{amPickerError}</p>
                        </template>
                    </div>
                    <div class="cs-modal-footer">
                        <button class="cs-modal-cancel" onclick={closeAccountManagerModal}>Cancel</button>
                        <button class="cs-modal-proceed" onclick={executeSubmit}>Final Submit</button>
                    </div>
                </div>
            </div>
        </template>

    </div>
</template>
